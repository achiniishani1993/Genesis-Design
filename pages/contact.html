<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genesis-Design</title>
    <!-- linked google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <!-- linked normalize.css -->
    <link rel="stylesheet" href="style/normalize.css" />
    <!-- linked index.css -->
    <link rel="stylesheet" href="/style/contact.css" />
  </head>
  <body>
    <nav>
      <div>
         <a href="/index.html"><img src="/Images/Logo (1).svg" alt="project log" /></a>
      </div>
      <div class="navLinks">
        <a href="/pages/projects.html">Projects</a>
        <a href="/pages/contact.html">Contacts</a>
      </div>
    </nav>
    <main>
      <section class="contact">
        <div class="contact_container">
          <div class="contact_text">
            <h2>Full set of great features to make your product fresh</h2>
            <p>
              Our favorite brands are our friends! We help them to achieve their
              goals, they help us to stay sharp.
            </p>
          </div>
          <div class="contact_form">
            <form>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Name"
                required
              /><br />
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
              /><br />
              <input
                type="text"
                id="message"
                name="message"
                placeholder="Message"
                required
              /><br /><br />
              <button type="submit" class="submit">Submit</button>
            </form>
          </div>
        </div>
        <div class="contact_map">
          <img src="/Images/Map.png" alt="location in a map image" />
        </div>
      </section>
    </main>

    <footer>
      <div class="footer__logo">
        <img src="/Images/Logo (1).svg" alt="project log" />
      </div>
      <div class="footerLinks">
        <a href="/pages/projects.html">Projects</a>
        <a href="/pages/contact.html">Contacts</a>
        <a href="https://dribbble.com/" target="_blank"
          ><img src="/Images/dribbble-logo.png" alt="drbble logo"
        /></a>
        <a href="https://www.facebook.com/" target="_blank"
          ><img src="/Images/instagram.png" alt="instagram logo"
        /></a>
        <a href="https://x.com/" target="_blank"
          ><img src="/Images/twitter-logo-silhouette.png" alt="twitter logo"
        /></a>
      </div>
    </footer>
  </body>
</html>
